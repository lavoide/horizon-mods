changelog = "0.2.1: no Minecraft data in the package. Spelunkery's changes to vanilla loot tables (rough gems and raw nuggets from vanilla ores, sculk to shears, no crying obsidian from bartering) are made in place on the player's own tables, and the copies of vanilla's ore features are gone, so the stone ore variants no longer generate. Shearing sculk now works."
